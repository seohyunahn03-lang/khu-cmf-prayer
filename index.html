function buildSeedRoster() {
  const seen = {};
  const members = SEED_MEMBERS.map((m) => {
    const key = `${m.name}__${m.dept}`;
    const n = seen[key] || 0;
    seen[key] = n + 1;
    const id = n ? `${key}__${n}` : key;
    return { id, name: m.name, dept: m.dept, pinned: !!m.pinned, active: true };
  });
  return { version: 5, members };
}

/* ================= storage =================
   순서: (1) 아티팩트 호스트의 window.storage (있으면) →
         (2) Firebase Firestore (db가 있으면, 실제 배포 환경) →
         (3) localStorage (오프라인/설정 전 임시 fallback) */
const hasRemote = typeof window !== "undefined" && window.storage && window.storage.get;
const S = {
  async get(key) {
    try {
      if (hasRemote) {
        const r = await window.storage.get(key, true);
        return r ? JSON.parse(r.value) : null;
      }
      if (typeof db !== "undefined" && db) {
        const snap = await db.collection("kv").doc(key).get();
        return snap.exists ? snap.data().value : null;
      }
      const v = localStorage.getItem("khcmf:" + key);
      return v ? JSON.parse(v) : null;
    } catch (e) { console.error("[storage.get]", key, e); return null; }
  },
  async set(key, val) {
    try {
      if (hasRemote) {
        const r = await window.storage.set(key, JSON.stringify(val), true);
        return !!r;
      }
      if (typeof db !== "undefined" && db) {
        await db.collection("kv").doc(key).set({ value: val, updatedAt: Date.now() });
        return true;
      }
      localStorage.setItem("khcmf:" + key, JSON.stringify(val));
      return true;
    } catch (e) { console.error("[storage.set]", key, e); return false; }
  },
};
const monthKey = (ym, suffix) => `pl:${ym}:${suffix}`;

/* ================= utils ================= */
function nowYM() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
}
function shiftYM(ym, delta) {
  const [y, m] = ym.split("-").map(Number);
  const d = new Date(y, m - 1 + delta, 1);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
}
const ymLabel = (ym) => {
  const [y, m] = ym.split("-");
  return `${y}년 ${Number(m)}월`;
};
function copyText(text) {
  try {
    if (navigator.clipboard?.writeText) return navigator.clipboard.writeText(text);
  } catch {}
  const ta = document.createElement("textarea");
  ta.value = text;
  document.body.appendChild(ta);
  ta.select();
  document.execCommand("copy");
  document.body.removeChild(ta);
  return Promise.resolve();
}

/* ================= 정렬: 제완주 간사님 고정 + 나머지 가나다순 ================= */
function sortMembers(members) {
  const pinned = members.filter((m) => m.pinned);
  const rest = members.filter((m) => !m.pinned).sort((a, b) => a.name.localeCompare(b.name, "ko"));
  return [...pinned, ...rest];
}

/* ================= 편지 조립 ================= */
function assembleLetter({ roster, subs, special, headVerse, filter }) {
  const blocks = [];
  const sorted = sortMembers(roster.members.filter((m) => m.active));
  const gradeOf = (m) => subs[m.id]?.grade || "";
  const memberLine = (m) => {
    const sub = subs[m.id];
    return {
      name: m.name, tag: m.dept,
      items: sub?.items?.length ? sub.items : [DEFAULT_PHRASE],
      submitted: !!sub?.items?.length,
    };
  };

  if (filter === "학년별") {
    [...GRADE_OPTIONS, "미기재"].forEach((g) => {
      const list = sorted.filter((m) => (g === "미기재" ? !gradeOf(m) : gradeOf(m) === g));
      if (list.length) blocks.push({ type: "flat", title: `${gradeLabel(g)} 기도제목`, lines: list.map(memberLine) });
    });
    return blocks;
  }

  blocks.push({ type: "flat", title: "전체 기도제목", lines: sorted.map(memberLine) });
  SPECIAL_SECTIONS.forEach((sec) => {
    if (special?.[sec]) blocks.push({ type: "special", title: sec, text: special[sec] });
  });
  return blocks;
}

function letterToText(blocks, ym, headVerse, markdown) {
  const H = (t) => (markdown ? `## ${t}` : `♥ ${t}`);
  const out = [];
  out.push(markdown ? `# 경희 CMF ${ymLabel(ym)} 기도편지` : `경희 CMF ${ymLabel(ym)} 기도편지`);
  out.push("");
  out.push(headVerse.text);
  out.push(`-${headVerse.ref}-`);
  out.push("");
  blocks.forEach((b) => {
    out.push(H(b.title + (b.nick ? ` (${b.verseRef}, ${b.nick})` : b.verseRef ? ` (${b.verseRef})` : "")));
    if (b.verseText) out.push(markdown ? `> ${b.verseText}` : `“${b.verseText}”`);
    if (b.type === "special") out.push(b.text);
    else b.lines.forEach((l) => {
      const deptTag = l.tag ? `[${l.tag}] ` : "";
      if (l.items.length <= 1) {
        const body = l.items[0] || "";
        out.push(markdown ? `- **${deptTag}${l.name}** ${body}` : `${deptTag}${l.name} ${body}`);
      } else {
        out.push(markdown ? `- **${deptTag}${l.name}**` : `${deptTag}${l.name}`);
        l.items.forEach((it, i) => out.push(`  ${i + 1}. ${it}`));
      }
    });
    out.push("");
  });
  return out.join("\n");
}

  fontWeight: 400, display: "inline-flex", alignItems: "center", gap: 6,

};
function Btn({ primary, children, ...p }) {

    <button {...p} style={{
      ...btnBase,
      ...(primary ? { background: C.accent, borderColor: C.accentDeep, color: "#fff", fontWeight: 700 } : {}),
      opacity: p.disabled ? 0.5 : 1, ...p.style,

}
function Card({ children, style }) {
  return (
    <div style={{
      background: C.card, border: `1px solid ${C.line}`, borderRadius: 16,
      padding: 18, boxShadow: "0 2px 10px rgba(74,59,47,0.05)", ...style,

}
function SectionTitle({ children }) {
  return (
    <div style={{
      fontFamily: SANS, fontSize: 16, fontWeight: 700, color: C.ink,

      <span style={{ color: C.accent, fontSize: 13 }}>♥</span>{children}
    </div>
  );
}

/* ================= 게이트: 편지봉투 ================= */
function Gate({ onEnter }) {
  const [code, setCode] = useState("");
  const [err, setErr] = useState(false);
  const [opening, setOpening] = useState(false);

  const submit = () => {
    const v = code.trim().toLowerCase();
    let admin = null;
    if (v === ADMIN_PASS) admin = true;
    else if (v === MEMBER_PASS) admin = false;
    if (admin === null) { setErr(true); return; }
    setOpening(true);
    setTimeout(() => onEnter(admin), 1900);
  };

  const W = 340, H = 220;
  return (
    <div style={{
      minHeight: "100vh", background: C.bg, display: "flex", flexDirection: "column",
      alignItems: "center", justifyContent: "center", fontFamily: SANS, gap: 28,
      overflow: "hidden",
    }}>
      {/* 봉투 */}
      <div style={{ perspective: 900, opacity: opening ? undefined : 1 }}>
        <div style={{
          position: "relative", width: W, height: H,
          transition: "opacity .5s ease 1.5s, transform .5s ease 1.5s",
          opacity: opening ? 0 : 1,
          transform: opening ? "translateY(30px)" : "none",
        }}>
          {/* 봉투 뒷면 */}
          <div style={{
            position: "absolute", inset: 0, background: C.kraft, borderRadius: 10,
            border: `1px solid ${C.kraftDeep}`, boxShadow: "0 14px 34px rgba(74,59,47,0.16)",
          }} />
          {/* 속지 편지 — 닫힌 동안엔 봉투 안에 완전히 숨김 */}
          <div style={{
            position: "absolute", left: 14, right: 14, top: 46, height: H - 66,
            background: "#fff", borderRadius: 6, border: `1px solid ${C.line}`,
            display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 6,
            transition: "transform .9s cubic-bezier(.22,1,.36,1) .55s",
            transform: opening ? `translateY(-${H + 50}px)` : "translateY(0)",
            zIndex: opening ? 4 : 2,
          }}>
            <div style={{ fontWeight: 700, fontSize: 19, color: C.ink, letterSpacing: 1 }}>KHU CMF 기도편지</div>
            <div style={{ fontSize: 12, color: C.inkSoft }}>함께 기도하는 공간</div>
          </div>
          {/* 봉투 윗부분 크라프트 패널 (모서리를 크라프트로 유지 + 닫힌 편지 가림) */}
          <div style={{
            position: "absolute", left: 0, right: 0, top: 0, height: H * 0.4,
            background: C.kraft, borderRadius: "10px 10px 0 0",
            border: `1px solid ${C.kraftDeep}`, borderBottom: "none", boxSizing: "border-box",
            zIndex: 3,
          }} />
          {/* 봉투 앞면 포켓 */}
          <div style={{
            position: "absolute", left: 0, right: 0, bottom: 0, height: H * 0.62,
            background: `linear-gradient(180deg, ${C.kraft}, ${C.kraftDeep})`,
            borderRadius: "6px 6px 10px 10px", border: `1px solid ${C.kraftDeep}`,
            boxSizing: "border-box", zIndex: 5,
            display: "flex", alignItems: "flex-end", justifyContent: "space-between",
            padding: "0 16px 12px",
          }}>
            <span style={{ fontSize: 11, color: C.ink, opacity: 0.55, letterSpacing: 1 }}>TO. 경희 CMF 지체들에게</span>
            <span style={{
              width: 34, height: 24, borderRadius: 3, background: "#fff",
              border: `1px solid ${C.kraftDeep}`, display: "inline-flex",
              alignItems: "center", justifyContent: "center", fontSize: 12, color: C.accent,
            }}>♥</span>
          </div>
          {/* 플랩 (뚜껑) */}
          <div style={{
            position: "absolute", left: 0, right: 0, top: 0, height: H * 0.52,
            transformOrigin: "top center", transformStyle: "preserve-3d",
            transition: "transform .8s cubic-bezier(.4,0,.2,1), z-index 0s .4s",
            transform: opening ? "rotateX(180deg)" : "rotateX(0deg)",
            zIndex: opening ? 1 : 6,
            clipPath: "polygon(0 0, 100% 0, 50% 100%)",
            background: `linear-gradient(180deg, ${C.kraftDeep}, ${C.kraft})`,
            borderRadius: "10px 10px 0 0",
          }} />
          {/* 왁스 실 */}
          <div style={{
            position: "absolute", left: "50%", top: H * 0.52 - 22, marginLeft: -22,
            width: 44, height: 44, borderRadius: "50%", zIndex: 7,
            background: `radial-gradient(circle at 35% 30%, #D96A4E, ${C.accentDeep})`,
            boxShadow: "0 3px 8px rgba(160,63,43,0.4)",

          }}>♥</div>

        transition: "opacity .4s ease", opacity: opening ? 0 : 1,
        pointerEvents: opening ? "none" : "auto",
      }}>

            onKeyDown={(e) => e.key === "Enter" && submit()}

              flex: 1, border: `1.5px solid ${err ? C.rose : C.line}`, borderRadius: 999,

      </div>
    </div>
  );
}

/* ================= 메인 앱 ================= */
function App() {
  const [entered, setEntered] = useState(false);
  const [isAdmin, setIsAdmin] = useState(false);
  const [tab, setTab] = useState("submit");
  const [ym, setYm] = useState(nowYM());
  const [roster, setRoster] = useState(null);
  const [subs, setSubs] = useState({});
  const [special, setSpecial] = useState({});
  const [headVerse, setHeadVerse] = useState(DEFAULT_HEAD_VERSE);
  const [loading, setLoading] = useState(true);
  const [toast, setToast] = useState("");

  const notify = (msg) => { setToast(msg); setTimeout(() => setToast(""), 2200); };

  useEffect(() => {
    if (!entered) return;
    (async () => {
      let r = await S.get("pl:members");
      if (!r) { r = buildSeedRoster(); await S.set("pl:members", r); }
      setRoster(r);
    })();
  }, [entered]);

  useEffect(() => {
    if (!roster) return;
    let cancel = false;
    (async () => {
      setLoading(true);
      const [subsDoc, sp] = await Promise.all([
        S.get(monthKey(ym, "subs")),
        S.get(monthKey(ym, "special")),
      ]);
      if (cancel) return;
      setSubs(subsDoc || {});
      setSpecial(sp?.sections || {});
      setHeadVerse(sp?.headVerse || DEFAULT_HEAD_VERSE);
      setLoading(false);
    })();
    return () => { cancel = true; };
  }, [roster, ym]);

  const saveSubmission = async (member, grade, items) => {
    const key = monthKey(ym, "subs");
    const latest = (await S.get(key)) || {};
    latest[member.id] = { grade, items, at: Date.now() };
    const ok = await S.set(key, latest);
    if (ok) {
      setSubs(latest);
      notify(`${member.name} 기도제목이 저장됐어요`);
    } else notify("저장에 실패했어요. 다시 시도해주세요.");
    return ok;
  };

  const saveSpecial = async (sections, hv) => {
    const ok = await S.set(monthKey(ym, "special"), { sections, headVerse: hv });
    if (ok) { setSpecial(sections); setHeadVerse(hv); notify("공통 섹션이 저장됐어요"); }
    else notify("저장에 실패했어요.");
  };

  const saveRoster = async (next) => {
    const ok = await S.set("pl:members", next);
    if (ok) { setRoster(next); notify("명단이 저장됐어요"); }
    else notify("저장에 실패했어요.");
  };

  if (!entered) return <Gate onEnter={(admin) => { setIsAdmin(admin); setEntered(true); }} />;

  const tabs = [
    { id: "submit", label: "기도제목 제출" },
    { id: "letter", label: "편지 보기" },
    ...(isAdmin ? [
      { id: "status", label: "제출 현황" },
      { id: "special", label: "공통 섹션" },
      { id: "roster", label: "명단 관리" },
    ] : []),
  ];

  return (
    <div style={{ minHeight: "100vh", background: C.bg, fontFamily: SANS, color: C.ink, animation: "fadeUp .6s ease both" }}>
      {/* 에어메일 스트라이프 */}
      <div style={{ height: 6, background: AIRMAIL, opacity: 0.85 }} />
      {/* header */}
      <div style={{ background: C.card, borderBottom: `1px solid ${C.line}`, padding: "16px 20px 12px" }}>
        <div style={{ maxWidth: 860, margin: "0 auto", display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 10 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            <span style={{
              width: 34, height: 34, borderRadius: "50%", background: C.accent, color: "#fff",
              display: "inline-flex", alignItems: "center", justifyContent: "center", fontSize: 15,
            }}>✉</span>
            <span style={{ fontSize: 20, fontWeight: 700, letterSpacing: 0.5 }}>KHU CMF 기도편지</span>
            {isAdmin && <span style={{ fontSize: 11, background: C.bgDeep, border: `1px solid ${C.line}`, borderRadius: 20, padding: "2px 10px", color: C.accentDeep, fontWeight: 700 }}>관리자</span>}
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
            <Btn onClick={() => setYm(shiftYM(ym, -1))} style={{ padding: "6px 12px" }}>‹</Btn>
            <span style={{ fontWeight: 700, minWidth: 96, textAlign: "center", fontSize: 15 }}>{ymLabel(ym)}</span>
            <Btn onClick={() => setYm(shiftYM(ym, 1))} style={{ padding: "6px 12px" }}>›</Btn>
          </div>
        </div>
        <div style={{ maxWidth: 860, margin: "12px auto 0", display: "flex", gap: 6, flexWrap: "wrap" }}>
          {tabs.map((t) => (
            <button key={t.id} onClick={() => setTab(t.id)} style={{
              ...btnBase, padding: "7px 14px", fontSize: 13,
              background: tab === t.id ? C.ink : "transparent",
              color: tab === t.id ? "#FFFDF8" : C.inkSoft,
              border: tab === t.id ? `1.5px solid ${C.ink}` : "1.5px solid transparent",
              fontWeight: tab === t.id ? 700 : 400,
            }}>{t.label}</button>
          ))}
        </div>
      </div>

      <div style={{ maxWidth: 860, margin: "0 auto", padding: "20px 16px 60px" }}>
        {loading || !roster ? (
          <div style={{ textAlign: "center", padding: 60, color: C.inkSoft }}>
            <Spinner size={22} />
            <div style={{ marginTop: 10, fontSize: 13 }}>불러오는 중…</div>
          </div>
        ) : (
          <>
            {tab === "submit" && <SubmitTab roster={roster} subs={subs} onSave={saveSubmission} ym={ym} />}
            {tab === "letter" && <LetterTab roster={roster} subs={subs} special={special} headVerse={headVerse} ym={ym} notify={notify} />}
            {tab === "status" && isAdmin && <StatusTab roster={roster} subs={subs} ym={ym} notify={notify} />}
            {tab === "special" && isAdmin && <SpecialTab special={special} headVerse={headVerse} onSave={saveSpecial} />}
            {tab === "roster" && isAdmin && <RosterTab roster={roster} onSave={saveRoster} />}
          </>
        )}
      </div>

      {toast && (
        <div style={{
          position: "fixed", bottom: 24, left: "50%", transform: "translateX(-50%)",
          background: C.ink, color: "#fff", borderRadius: 12, padding: "10px 18px",
          fontSize: 13, boxShadow: "0 4px 16px rgba(0,0,0,0.18)", zIndex: 50, fontFamily: SANS,
        }}>{toast}</div>
      )}
    </div>
  );
}

/* ================= 제출 탭 ================= */
function SubmitTab({ roster, subs, onSave, ym }) {
  const [member, setMember] = useState(null);
  const [grade, setGrade] = useState("");
  const [blocks, setBlocks] = useState([]);
  const [saving, setSaving] = useState(false);
  const [q, setQ] = useState("");

  const sorted = useMemo(
    () => sortMembers(roster.members.filter((m) => m.active)),
    [roster]
  );
  const visible = useMemo(() => {
    if (!q.trim()) return sorted;
    return sorted.filter((m) => m.name.includes(q.trim()));
  }, [sorted, q]);

  const pick = (m) => {
    setMember(m);
    const prev = subs[m.id];
    setGrade(prev?.grade || "");
    setBlocks(prev?.items?.length ? [...prev.items] : ["", "", ""]);
  };

  const setBlock = (i, v) => setBlocks((b) => b.map((x, xi) => (xi === i ? v : x)));
  const removeBlock = (i) => setBlocks((b) => b.filter((_, xi) => xi !== i));
  const addBlock = () => setBlocks((b) => [...b, ""]);

  const save = async () => {
    const items = blocks.map((s) => s.trim()).filter(Boolean);
    setSaving(true);
    await onSave(member, grade, items);
    setSaving(false);
  };

  return (
    <div style={{ display: "grid", gap: 14 }}>
      <Card>
        <SectionTitle>{ymLabel(ym)} 기도제목 제출</SectionTitle>
        <div style={{ fontSize: 13, color: C.inkSoft, marginBottom: 12 }}>
          이름을 눌러서 학년을 선택하고, 기도제목을 적어주세요.
        </div>
        <input
          value={q} onChange={(e) => setQ(e.target.value)} placeholder="이름 검색"
          style={{
            width: "100%", boxSizing: "border-box", border: `1px solid ${C.line}`, borderRadius: 12,
            padding: 10, fontSize: 14, background: C.bg, fontFamily: SANS, marginBottom: 12,
          }}
        />
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          {visible.map((m) => {
            const done = !!subs[m.id]?.items?.length;
            const sel = member?.id === m.id;
            return (
              <button key={m.id} onClick={() => pick(m)} style={{
                ...btnBase, padding: "7px 12px", fontSize: 13, fontWeight: 700,
                background: sel ? C.ink : done ? C.bgDeep : C.card,
                color: sel ? "#fff" : C.ink,
              }}>
                {m.name}
                {done && <span style={{ color: sel ? "#fff" : C.blue, fontSize: 12 }}>✓</span>}
              </button>
            );
          })}
        </div>
      </Card>

      {member && (
        <Card>
          <SectionTitle>{member.name} 님의 기도제목</SectionTitle>
          <div style={{ marginBottom: 14 }}>
            <div style={{ fontSize: 13, color: C.inkSoft, marginBottom: 6 }}>학년</div>
            <select value={grade} onChange={(e) => setGrade(e.target.value)}
              style={{ border: `1px solid ${C.line}`, borderRadius: 10, padding: "8px 10px", fontSize: 14, background: C.bg, fontFamily: SANS }}>
              <option value="">학년을 선택해주세요</option>
              {GRADE_OPTIONS.map((g) => <option key={g} value={g}>{gradeLabel(g)}</option>)}
            </select>
          </div>

          <div style={{ display: "grid", gap: 8, marginBottom: 10 }}>
            {blocks.map((v, i) => (
              <div key={i} style={{ display: "flex", gap: 6 }}>
                <input
                  value={v} onChange={(e) => setBlock(i, e.target.value)}
                  placeholder={`기도제목 ${i + 1}`}
                  style={{
                    flex: 1, border: `1px solid ${C.line}`, borderRadius: 10, padding: 10,
                    fontSize: 14, fontFamily: SANS, background: C.bg, color: C.ink, outline: "none",
                  }}
                />
                <Btn onClick={() => removeBlock(i)} style={{ padding: "4px 10px", color: C.rose }}>×</Btn>
              </div>
            ))}
          </div>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <Btn onClick={addBlock}>+ 기도제목 추가</Btn>
            <Btn primary onClick={save} disabled={saving}>
              {saving ? <Spinner size={15} /> : "✉"} 저장하기
            </Btn>
          </div>
        </Card>
      )}
    </div>
  );
}

                      )}
                    </div>
                  ))}
                </div>
              )}
            </div>
          ))}

          <div style={{ textAlign: "center", marginTop: 34, fontSize: 13, color: C.inkSoft }}>
            FROM. 경희 CMF ♥
          </div>
        </div>
      </Card>
    </div>
  );
}

/* ================= 제출 현황 탭 (관리자) ================= */
function StatusTab({ roster, subs, ym, notify }) {
  const list = sortMembers(roster.members.filter((m) => m.active));
  const missing = list.filter((m) => !subs[m.id]?.items?.length);
  const done = list.length - missing.length;

  const copyReminder = async () => {
    const lines = [`[${ymLabel(ym)} 기도편지 미제출 안내]`, missing.map((m) => m.name).join(", "), "", "기도제목 부탁드려요 🙏"];
    await copyText(lines.join("\n"));
    notify("리마인드 문구를 복사했어요 (카톡에 붙여넣기)");
  };

  return (
    <div style={{ display: "grid", gap: 14 }}>
      <Card style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 10 }}>
        <SectionTitle>{ymLabel(ym)} 제출 현황 — {done}/{list.length}명</SectionTitle>
        <Btn primary onClick={copyReminder}>미제출자 리마인드 복사</Btn>
      </Card>
      <Card>
        <div style={{ height: 8, background: C.bgDeep, borderRadius: 6, overflow: "hidden", marginBottom: 10 }}>
          <div style={{ width: `${list.length ? (done / list.length) * 100 : 0}%`, height: "100%", background: C.accent, transition: "width .3s" }} />
        </div>
        {missing.length > 0 ? (
          <div style={{ fontSize: 13, color: C.inkSoft, fontWeight: 400, lineHeight: 1.9 }}>
            미제출: {missing.map((m) => m.name).join(", ")}
          </div>
        ) : (
          <div style={{ fontSize: 13, color: C.blue, display: "flex", alignItems: "center", gap: 4 }}>✓ 전원 제출 완료</div>
        )}
      </Card>
    </div>
  );
}

/* ================= 공통 섹션 탭 (관리자) ================= */
function SpecialTab({ special, headVerse, onSave }) {
  const [draft, setDraft] = useState(special);
  const [hv, setHv] = useState(headVerse);
  useEffect(() => { setDraft(special); setHv(headVerse); }, [special, headVerse]);

  return (
    <div style={{ display: "grid", gap: 14 }}>
      <Card>
        <SectionTitle>표지 말씀</SectionTitle>
        <input value={hv.ref} onChange={(e) => setHv({ ...hv, ref: e.target.value })}
          style={{ width: "100%", boxSizing: "border-box", border: `1px solid ${C.line}`, borderRadius: 12, padding: 10, fontSize: 14, marginBottom: 8, background: C.bg, fontFamily: SANS }}
          placeholder="말씀 출처 (예: 빌립보서 4:6-7)" />
        <textarea value={hv.text} onChange={(e) => setHv({ ...hv, text: e.target.value })} rows={3}
          style={{ width: "100%", boxSizing: "border-box", border: `1px solid ${C.line}`, borderRadius: 12, padding: 10, fontSize: 14, background: C.bg, resize: "vertical", fontFamily: SANS }} />
      </Card>
      {SPECIAL_SECTIONS.map((sec) => (
        <Card key={sec}>
          <SectionTitle>{sec}</SectionTitle>
          <textarea
            value={draft[sec] || ""} rows={4}
            onChange={(e) => setDraft({ ...draft, [sec]: e.target.value })}
            placeholder={`${sec} 기도제목 (비워두면 편지에서 제외돼요)`}
            style={{ width: "100%", boxSizing: "border-box", border: `1px solid ${C.line}`, borderRadius: 12, padding: 10, fontSize: 14, background: C.bg, resize: "vertical", fontFamily: SANS }}
          />
        </Card>
      ))}
      <div style={{ display: "flex", justifyContent: "flex-end" }}>
        <Btn primary onClick={() => onSave(draft, hv)}>공통 섹션 저장</Btn>
      </div>
    </div>
  );
}

/* ================= 명단 일괄 교체 파싱 =================
   한 줄에 한 명씩. 이름 뒤 괄호로 학과 표시 가능: "최우석 (의대)" */
function parseBulkRoster(text) {
  const lines = text.split("\n").map((l) => l.trim()).filter(Boolean);
  const members = [];
  lines.forEach((line) => {
    const m = line.match(/^(.+?)\s*(?:\(([^)]*)\))?$/);
    const name = (m ? m[1] : line).trim();
    if (!name) return;
    const tags = m && m[2] ? m[2].split(",").map((t) => t.trim()) : [];
    let dept = "";
    tags.forEach((t) => {
      if (["의대", "치대", "한의대", "간호대"].includes(t)) dept = t;
    });
    members.push({ id: `${name}__${dept}__${Date.now()}_${members.length}`, name, dept, pinned: false, active: true });
  });
  return { version: 5, members };
}

/* ================= 명단 관리 탭 (관리자) ================= */
function RosterTab({ roster, onSave }) {
  const [newName, setNewName] = useState("");
  const [newDept, setNewDept] = useState("");
  const [bulkText, setBulkText] = useState("");
  const [q, setQ] = useState("");
  const list = useMemo(() => {
    const sorted = sortMembers(roster.members);
    if (!q.trim()) return sorted;
    return sorted.filter((m) => m.name.includes(q.trim()));
  }, [roster, q]);

  const update = (id, patch) => {
    const next = { ...roster, members: roster.members.map((m) => (m.id === id ? { ...m, ...patch } : m)) };
    onSave(next);
  };
  const remove = (id) => {
    const next = { ...roster, members: roster.members.filter((m) => m.id !== id) };
    onSave(next);
  };
  const add = () => {
    const name = newName.trim();
    if (!name) return;
    const id = `${name}__${newDept}__${Date.now()}`;
    onSave({ ...roster, members: [...roster.members, { id, name, dept: newDept, pinned: false, active: true }] });
    setNewName("");
  };
  const applyBulk = () => {
    if (!bulkText.trim()) return;
    const parsed = parseBulkRoster(bulkText);
    if (!parsed.members.length) { alert("이름이 인식되지 않았어요. 형식을 확인해주세요."); return; }
    const pinnedGwansa = roster.members.find((m) => m.pinned);
    if (confirm(`${parsed.members.length}명으로 명단 전체를 교체할까요?\n(제완주 간사님은 그대로 맨 위에 유지되고, 이미 제출된 기도제목은 그대로 유지돼요)`)) {
      onSave({ ...parsed, members: pinnedGwansa ? [pinnedGwansa, ...parsed.members] : parsed.members });
      setBulkText("");
    }
  };
  const resetToSeed = () => {
    if (confirm("명단을 2026년 8월 시드(가나다순, 143명 + 제완주 간사님)로 전체 교체할까요?\n(이미 제출된 기도제목은 그대로 유지돼요)")) {
      onSave(buildSeedRoster());
    }
  };

  return (
    <div style={{ display: "grid", gap: 14 }}>
      <Card style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 10 }}>
        <div style={{ fontSize: 13, color: C.inkSoft }}>8월 시드(가나다순 명단)로 다시 초기화하고 싶을 때 사용해요.</div>
        <Btn primary onClick={resetToSeed}>8월 시드로 초기화</Btn>
      </Card>

      <Card>
        <SectionTitle>명단 일괄 교체</SectionTitle>
        <div style={{ fontSize: 13, color: C.inkSoft, marginBottom: 10, lineHeight: 1.8 }}>
          한 줄에 한 명씩 적어주세요. 이름 뒤 괄호로 학과를 표시할 수 있어요 (생략 가능): <b>최우석 (의대)</b>
        </div>
        <textarea
          value={bulkText} onChange={(e) => setBulkText(e.target.value)} rows={10}
          placeholder={"최우석 (의대)\n김태희 (치대)\n김나연"}
          style={{ width: "100%", boxSizing: "border-box", border: `1px solid ${C.line}`, borderRadius: 12, padding: 10, fontSize: 13, background: C.bg, resize: "vertical", fontFamily: SANS, lineHeight: 1.8 }}
        />
        <div style={{ display: "flex", justifyContent: "flex-end", marginTop: 10 }}>
          <Btn primary onClick={applyBulk}>이 내용으로 명단 전체 교체</Btn>
        </div>
      </Card>

      <Card>
        <div style={{ display: "flex", gap: 8, marginBottom: 14, flexWrap: "wrap" }}>
          <input value={newName} onChange={(e) => setNewName(e.target.value)} onKeyDown={(e) => e.key === "Enter" && add()}
            placeholder="추가할 이름"
            style={{ flex: 1, minWidth: 120, border: `1px solid ${C.line}`, borderRadius: 12, padding: 10, fontSize: 14, background: C.bg, fontFamily: SANS }} />
          <select value={newDept} onChange={(e) => setNewDept(e.target.value)}
            style={{ border: `1px solid ${C.line}`, borderRadius: 12, padding: 10, fontSize: 14, background: C.bg, fontFamily: SANS }}>
            <option value="">학과 미지정</option>
            {["의대", "치대", "한의대", "간호대"].map((d) => <option key={d} value={d}>{d}</option>)}
          </select>
          <Btn primary onClick={add}>+ 추가</Btn>
        </div>
        <input
          value={q} onChange={(e) => setQ(e.target.value)} placeholder="이름 검색"
          style={{ width: "100%", boxSizing: "border-box", border: `1px solid ${C.line}`, borderRadius: 12, padding: 10, fontSize: 14, background: C.bg, fontFamily: SANS, marginBottom: 12 }}
        />
        <div style={{ display: "grid", gap: 8 }}>
          {list.map((m) => (
            <div key={m.id} style={{
              display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap",
              padding: "8px 10px", background: m.active ? C.bg : C.bgDeep,
              borderRadius: 10, opacity: m.active ? 1 : 0.55,
            }}>
              <span style={{ fontWeight: 700, minWidth: 64 }}>{m.name}</span>
              <select value={m.dept} onChange={(e) => update(m.id, { dept: e.target.value })}
                style={{ border: `1px solid ${C.line}`, borderRadius: 8, padding: "4px 8px", fontSize: 12, background: C.card, fontFamily: SANS }}>
                <option value="">학과 미지정</option>
                {["의대", "치대", "한의대", "간호대"].map((d) => <option key={d} value={d}>{d}</option>)}
              </select>
              <div style={{ marginLeft: "auto", display: "flex", gap: 6 }}>
                <Btn onClick={() => update(m.id, { active: !m.active })} style={{ fontSize: 12, padding: "4px 10px" }}>
                  {m.active ? "휴면 처리" : "활성화"}
                </Btn>
                <Btn onClick={() => remove(m.id)} style={{ fontSize: 12, padding: "4px 8px", color: C.rose }}>×</Btn>
              </div>
            </div>
          ))}
        </div>
      </Card>
    </div>
  );
}
